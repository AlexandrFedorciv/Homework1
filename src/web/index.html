<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PartsBin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f1ea;
    --grid: #e3ded2;
    --ink: #1d1f22;
    --muted: #6b6a66;
    --card: #fffdf8;
    --line: #d9d3c5;
    --accent: #e8590c;
    --ok: #2b8a3e;
    --warn: #c77700;
    --bad: #c92a2a;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16181b; --grid: #1f2226; --ink: #ece8df; --muted: #9a978f;
      --card: #1d2024; --line: #33373d; --accent: #ff7a33; --ok: #51cf66; --warn: #fcc419; --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); color: var(--ink); background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; line-height: 1.5;
  }
  header { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; position: sticky; top: 16px; }
  @media (max-width: 860px) { form { position: static; } }
  label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea, input, select {
    width: 100%; font: 14px var(--mono); color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row label { margin-top: 14px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
  .check input { width: auto; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--muted);
    cursor: pointer; margin-top: 8px; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop img { max-width: 100%; max-height: 140px; border-radius: 6px; display: block; margin: 0 auto 6px; }
  button {
    width: 100%; margin-top: 18px; padding: 12px; font: 600 15px var(--sans); color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  #status { font: 13px var(--mono); color: var(--muted); min-height: 20px; }
  .error { color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--card)); border: 1px solid var(--bad); padding: 12px; border-radius: 8px; }
  .empty { border: 1.5px dashed var(--line); border-radius: 10px; padding: 48px 24px; text-align: center; color: var(--muted); background: var(--card); }

  .project { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .project-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .project-head h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; }
  .project-head h2 .n { font: 600 14px var(--mono); color: var(--accent); }
  .project-head p { margin: 0 0 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; font: 12px var(--mono); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  .cover { height: 4px; background: var(--line); }
  .cover div { height: 100%; background: var(--ok); }
  .body { display: grid; grid-template-columns: 1fr 1.3fr; gap: 0; }
  @media (max-width: 1000px) { .body { grid-template-columns: 1fr; } }
  .body section { padding: 14px 18px; }
  .body section + section { border-left: 1px solid var(--line); }
  @media (max-width: 1000px) { .body section + section { border-left: 0; border-top: 1px solid var(--line); } }
  h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  ul.parts { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  ul.parts li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 5px 0; border-bottom: 1px dotted var(--line); }
  ul.parts li:last-child { border-bottom: 0; }
  .mark { font-weight: 700; }
  .have .mark { color: var(--ok); }
  .miss .mark { color: var(--bad); }
  .part .mark { color: var(--warn); }
  .purpose { display: block; color: var(--muted); font-size: 12px; }
  .price { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .miss .price, .part .price { color: var(--bad); }
  ol.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 10px 32px; font-size: 14px; }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--ink); font: 600 11px/19px var(--mono); text-align: center;
  }
  ol.steps b { display: block; }
  .safety { margin: 4px 0 0; padding: 10px 12px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); font-size: 13px; }
  .safety p { margin: 0 0 4px; }
  .foot { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; font: 12px var(--mono); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar button { width: auto; margin: 0; padding: 8px 14px; font-size: 13px; background: var(--ink); color: var(--paper); }
  .notes { font: 12px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Parts<span>Bin</span></h1>
  <p>Tell it what's in your drawer. Get three things you can build this weekend.</p>
</header>
<main>
  <form id="form">
    <label for="parts">Parts you have</label>
    <textarea id="parts" placeholder="arduino uno&#10;4x sg90 servo&#10;hc-sr04&#10;breadboard&#10;jumper wires" required></textarea>
    <div class="drop" id="drop" tabindex="0">📷 Drop a photo of your parts bin, or click to choose<input type="file" id="photo" accept="image/*" hidden /></div>
    <div class="hint">Detected parts are added to the list so you can fix them before generating.</div>

    <label for="goal">Goal (optional)</label>
    <input id="goal" placeholder="something that walks" />

    <div class="row">
      <div><label for="skill">Skill</label>
        <select id="skill"><option value="">any</option><option>beginner</option><option>intermediate</option><option>advanced</option></select></div>
      <div><label for="hours">Max h</label><input id="hours" type="number" min="0.5" step="0.5" placeholder="—" /></div>
      <div><label for="budget">Budget CZK</label><input id="budget" type="number" min="0" step="50" placeholder="—" /></div>
    </div>
    <label class="check"><input type="checkbox" id="nosolder" /> I can't solder</label>

    <button id="go" type="submit">Suggest 3 projects</button>
    <div class="hint" id="model"></div>
  </form>

  <div>
    <div id="status"></div>
    <div id="out"><div class="empty">Your project plans will appear here.</div></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  let lastResult = null;

  fetch("/api/info").then((r) => r.json()).then((d) => ($("model").textContent = `Model: ${d.model}`)).catch(() => {});

  async function api(path, body) {
    const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // --- photo → parts -------------------------------------------------------
  const drop = $("drop"), photo = $("photo");
  drop.addEventListener("click", () => photo.click());
  drop.addEventListener("keydown", (e) => (e.key === "Enter" || e.key === " ") && photo.click());
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) handlePhoto(e.dataTransfer.files[0]); });
  photo.addEventListener("change", () => photo.files[0] && handlePhoto(photo.files[0]));

  async function shrink(file) {
    // Resize big phone photos to ~1600 px so uploads stay small and fast.
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const canvas = Object.assign(document.createElement("canvas"), { width: img.width * scale, height: img.height * scale });
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  }

  async function handlePhoto(file) {
    try {
      const dataUrl = await shrink(file);
      drop.innerHTML = `<img src="${dataUrl}" alt="parts photo" />Detecting parts…`;
      const { parts } = await api("/api/detect", { image: dataUrl });
      const lines = parts.map((p) => `${p.qty}x ${p.name}`);
      const box = $("parts");
      box.value = [box.value.trim(), ...lines].filter(Boolean).join("\n");
      drop.innerHTML = `<img src="${dataUrl}" alt="parts photo" />Found ${parts.length} part type(s) — check the list above.`;
    } catch (e) {
      drop.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span><br/>Click to try another photo`;
    }
    drop.appendChild(photo);
  }

  // --- generate -------------------------------------------------------------
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const constraints = {};
    if ($("goal").value.trim()) constraints.goal = $("goal").value.trim();
    if ($("skill").value) constraints.skill = $("skill").value;
    if ($("hours").value) constraints.maxHours = Number($("hours").value);
    if ($("budget").value) constraints.budget = Number($("budget").value);
    if ($("nosolder").checked) constraints.canSolder = false;

    $("go").disabled = true;
    $("status").textContent = "Designing projects, checking constraints… (10–40 s)";
    try {
      lastResult = await api("/api/suggest", { parts: $("parts").value, constraints });
      render(lastResult);
      $("status").textContent = "";
    } catch (err) {
      $("status").textContent = "";
      $("out").innerHTML = `<div class="error">✗ ${esc(err.message)}</div>`;
    } finally {
      $("go").disabled = false;
    }
  });

  function render(r) {
    const cards = r.projects.map((p, i) => {
      const parts = p.parts.map((x) => {
        const cls = x.missing === 0 ? "have" : x.have === 0 ? "miss" : "part";
        const mark = x.missing === 0 ? "✓" : x.have === 0 ? "✗" : "◐";
        const status = x.missing === 0 ? "" : x.have === 0 ? "missing" : `have ${x.have}, need ${x.missing} more`;
        const price = x.missing && x.unitPriceCzk !== undefined ? `~${x.missing * x.unitPriceCzk} CZK` : status;
        return `<li class="${cls}"><span class="mark">${mark}</span><span>${x.qty}× ${esc(x.name)}<span class="purpose">${esc(x.purpose || "")}${x.have && x.missing ? ` · ${status}` : ""}</span></span><span class="price">${esc(price)}</span></li>`;
      }).join("");
      const steps = p.steps.map((s) => `<li><b>${esc(s.title)}</b>${esc(s.detail)}</li>`).join("");
      const safety = p.safetyNotes.length ? `<div class="safety">${p.safetyNotes.map((n) => `<p>⚠ ${esc(n)}</p>`).join("")}</div>` : "";
      const checks = p.checks.map((c) => `<span class="chip ${c.ok ? "ok" : "bad"}" title="${esc(c.detail)}">${c.ok ? "✓" : "✗"} ${esc(c.name)}</span>`).join("");
      const cost = p.missingCostCzk ? `~${p.missingCostCzk} CZK to buy` : "nothing to buy";
      return `<article class="project">
        <div class="project-head">
          <h2><span class="n">0${i + 1}</span>${esc(p.title)}</h2>
          <p>${esc(p.summary)}</p>
          <div class="meta">
            <span class="chip">${esc(p.difficulty)}</span>
            <span class="chip">~${p.estimatedHours} h</span>
            <span class="chip">${p.requiresSoldering ? "soldering" : "solderless"}</span>
            <span class="chip">you own ${Math.round(p.coverage * 100)}%</span>
            <span class="chip">${cost}${p.unpricedMissing.length ? " + household" : ""}</span>
          </div>
        </div>
        <div class="cover"><div style="width:${Math.round(p.coverage * 100)}%"></div></div>
        <div class="body">
          <section><h3>Parts</h3><ul class="parts">${parts}</ul></section>
          <section><h3>Build steps</h3><ol class="steps">${steps}</ol>${safety}</section>
        </div>
        <div class="foot">${checks}</div>
      </article>`;
    }).join("");
    const notes = r.notes.length ? r.notes.map((n) => `• ${esc(n)}`).join("<br/>") + "<br/>" : "";
    $("out").innerHTML = `<div class="toolbar"><span class="notes">${notes}${r.llmCalls} LLM call(s) · ${esc(r.model)}</span>
      <button type="button" id="dl">⬇ Shopping list</button></div>${cards}`;
    $("dl").addEventListener("click", downloadShoppingList);
  }

  function downloadShoppingList() {
    const lines = ["# Shopping list", ""];
    lastResult.projects.forEach((p, i) => {
      lines.push(`## ${i + 1}. ${p.title}`, "");
      const missing = p.parts.filter((x) => x.missing > 0);
      if (!missing.length) lines.push("You already have everything.");
      missing.forEach((m) => lines.push(`- [ ] ${m.missing}× ${m.name} — ${m.unitPriceCzk !== undefined ? `~${m.missing * m.unitPriceCzk} CZK` : "price n/a"}`));
      lines.push("");
    });
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/markdown" })),
      download: "shopping-list.md",
    });
    a.click();
  }
</script>
</body>
</html>
